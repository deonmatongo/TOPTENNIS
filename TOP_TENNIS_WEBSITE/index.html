    <!-- SportsOrganization structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SportsOrganization",
      "name": "Top Tennis League",
      "url": "https://toptennisleague.com",
      "logo": "https://toptennisleague.com/app-icon.png",
      "description": "Structured, competitive tennis leagues for all skill levels. Singles, doubles, and mixed doubles divisions with player matching and flexible scheduling.",
      "sport": "Tennis",
      "email": "support@toptennisleague.com",
      "sameAs": []
    }
    </script>

    <!-- FAQPage structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I find players at my skill level?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your profile includes a NTRP skill rating. When you join a league, you're placed in a division with players at a similar level so every match is competitive and fair."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a cost to join?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Basic registration is free. League season fees vary by division — check the Leagues page for current pricing. Fees cover court reservations, prizes, and platform costs."
          }
        },
        {
          "@type": "Question",
          "name": "How do I schedule matches with opponents?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Once placed in a league, you'll see your opponent list on the dashboard. Send a match invite, agree on a time and court, and both players get a calendar notification."
          }
        },
        {
          "@type": "Question",
          "name": "What happens if I need to cancel?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cancel through the dashboard as early as possible. Repeated last-minute cancellations may affect your player standing. Opponents can flag no-shows, which impacts your rating."
          }
        },
        {
          "@type": "Question",
          "name": "Can I play in tournaments and events?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — we run seasonal tournaments and round-robins open to league members. League members get priority registration before spots open to the public."
          }
        },
        {
          "@type": "Question",
          "name": "How is my ladder ranking calculated?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Rankings update in real time after each reported match. Wins against higher-ranked opponents earn more points. Consistent play and tournament results also boost your standing."
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
