name: OTA Update

on:
  push:
    branches: [main]
    paths:
      - 'TOP_TENNIS_MOBILE/src/**'
      - 'TOP_TENNIS_MOBILE/assets/**'
      - 'TOP_TENNIS_MOBILE/app.json'

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TOP_TENNIS_MOBILE/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: TOP_TENNIS_MOBILE

      - name: Publish OTA update to production
        run: |
          npx eas-cli update \
            --channel production \
            --message "${{ github.event.head_commit.message }}" \
            --non-interactive
        working-directory: TOP_TENNIS_MOBILE
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
