app            = 'top-tennis-support'
primary_region = 'jnb'   # Johannesburg — closest fly.io region to Zimbabwe

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT     = '3001'
  NODE_ENV = 'production'
  # All secrets (TWILIO_*, ANTHROPIC_API_KEY, WEBHOOK_BASE_URL) are set via:
  #   fly secrets set KEY=value ...
  # Never put real values in this file.

[http_service]
  internal_port        = 3001
  force_https          = true
  auto_stop_machines   = 'stop'    # scales to zero when idle — saves cost
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory   = '256mb'
  cpu_kind = 'shared'
  cpus     = 1
